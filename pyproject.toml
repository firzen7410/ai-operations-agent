[project]
name = "ai-operations-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.2,<1",
    "pydantic>=2.14.3,<3",
    "uvicorn>=0.54.0,<1",
    "sqlalchemy (>=2,<2.1)",
    "pydantic-settings (>=2,<3)",
    "httpx (>=0.28.1,<1)",
    "alembic (>=1.16,<2)",
    "psycopg[binary] (>=3.2,<4)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.2.0,<10"
